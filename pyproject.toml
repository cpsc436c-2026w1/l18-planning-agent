[project]
name = "l18-planning-agent"
version = "0.1.0"
description = "CPSC 436C L18 demo: planning agents on the grocery case, in plain Python, with Strands, on AgentCore"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "duckdb>=1.1",
    "httpx>=0.27",
]

[dependency-groups]
# Parts D and E. The Strands version is pinned: the hook and interrupt names below are the ones of this release.
strands = [
    "strands-agents[openai]==1.64.0",
    "bedrock-agentcore==1.26.0",
    "mcp>=1.20",
]
dev = [
    "behave>=1.3.3",
    "jinja2>=3.1",
    "moto[dynamodb,sns,sqs,ses,sesv2]>=5.0",
    "pytest>=8",
]
gepa = [
    "gepa==0.1.4",
]

# dspy_patterns/: five agentic patterns in DSPy. Both versions are pinned: the classes used (Refine, Parallel,
# ReAct, GEPA) were read in this release's source.
dspy = [
    "dspy==3.5.0",
    "gepa==0.1.4",
]

[tool.uv]
package = false
default-groups = ["dev", "strands", "gepa", "dspy"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "dspy_patterns/tests"]
